server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets are safe to cache forever.
    location ~* \.(js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never let a stale service worker or manifest get stuck cached — the
    # SW file itself controls update checks, so browsers must always
    # revalidate it.
    location ~* (sw\.js|manifest\.webmanifest|registerSW\.js)$ {
        expires off;
        add_header Cache-Control "no-cache";
    }

    location ~* \.(png|jpg|jpeg|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # SPA fallback — client-side routing (if any is added later) resolves
    # through index.html rather than 404ing on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
